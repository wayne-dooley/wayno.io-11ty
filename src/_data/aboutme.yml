  a: "I am fulent in all forms."

- q: "Favorite cereal"
  a: "Grape Nuts. Even as a kid."

- q: "Favorite ice cream"
  a: "Chocolate."

- q: "What is the first thing you notice about people"
  a: "Eye contact."

- q: "Favorite sport"
  a: "Baseball, but only casually, and only if I'm in the stands."

- q: "What inspires you"
  a: "Anyone that's passionate about their work or life. Anyone trying to make a difference."

