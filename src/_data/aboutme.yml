
- q: "What's your full name"
  a: "Wayne Martin Dooley"

- q: "Are you named after anyone"
  a: "My grandfather, my dad, and I share a middle name."

- q: "Where are you from"
  a: "A bit of all over the US. Mostly Illinois, California, Virginia, and New Mexico. I've spent most of my adult life in Texas, which I consider home."

- q: "Where were you born"
  a: "Detroit, Michigan."

- q: "Do you have a hobby"
  a: "I love woodworking, I've been at it for many years. I took over our two-car garage and turned it into a shop. My wife doesn't seem to mind, as long as I build her something every now and then."

- q: "Any pets"
  a: "Our dog Ellie, a sweet, lovable mutt."

- q: "Would you bungee jump"
  a: "Maybe. Sounds like a good way to pop my back."

